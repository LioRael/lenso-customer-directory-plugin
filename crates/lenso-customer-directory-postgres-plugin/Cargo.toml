[package]
name = "lenso-customer-directory-postgres-plugin"
version = "0.1.1"
description = "PostgreSQL-backed Customer Directory Plugin for Lenso applications."
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
include = ["configuration.schema.json", "migrations/*.sql", "src/*.rs"]

[package.metadata.lenso]
plugin-id = "lenso.customer-directory.postgres"
root-slot = "customer-directory"

[features]
default = []
postgres-acceptance = []

[dependencies]
futures.workspace = true
lenso.workspace = true
lenso-auth-sdk.workspace = true
lenso-capability-access-control.workspace = true
lenso-capability-customer-directory = { version = "0.1.1", path = "../lenso-capability-customer-directory" }
lenso-capability-data-export-source.workspace = true
lenso-capability-retention-participant.workspace = true
lenso-capability-secrets.workspace = true
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
lenso-app-plan.workspace = true
tokio.workspace = true

[lints]
workspace = true
